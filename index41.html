`function swipeRow(row, onDel, onTap, onPin, pinned){
  let x0 = 0, y0 = 0, dx = 0, pos = 0, drag = false;
  const W = 84;
  row.style.position = "relative";
  row.style.overflow = "hidden";
  row.style.touchAction = "pan-y";
  const mkBtn = (bg, side, icon, label) => {
    const b = document.createElement("button");
    b.style.cssText = "position:absolute;top:0;bottom:0;" + side + ":0;width:" + W + "px;border-radius:0;background:" + bg + ";color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translateX(" + (side === "right" ? "100%" : "-100%") + ")";
    const i = document.createElement("span");
    i.textContent = icon;
    i.style.fontSize = "22px";
    b.appendChild(i);
    if (label) {
      const t = document.createElement("span");
      t.textContent = label;
      t.style.fontSize = "11px";
      b.appendChild(t);
    }
    row.appendChild(b);
    return b;
  };
  if (pinned) {
    const m = document.createElement("span");
    m.textContent = "📌";
    m.style.cssText = "position:absolute;left:46px;bottom:6px;font-size:13px";
    row.appendChild(m);
  }
  const dl = onDel ? mkBtn("#e5545c", "right", "🗑", "") : null;
  const pl = onPin ? mkBtn("#128C7E", "left", "📌", pinned ? "Désépingler" : "Épingler") : null;
  const mv = (px, anim) => {
    const tr = anim ? "transform .15s" : "none";
    Array.from(row.children).forEach(c => {
      c.style.transition = tr;
      if (c === dl) c.style.transform = "translateX(" + (W + px) + "px)";
      else if (c === pl) c.style.transform = "translateX(" + (px - W) + "px)";
      else c.style.transform = "translateX(" + px + "px)";
    });
  };
  const close = () => { pos = 0; mv(0, true); };
  row.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; drag = false; }, { passive: true });
  row.addEventListener("touchmove", e => {
    const t = e.touches[0], ddx = t.clientX - x0, ddy = t.clientY - y0;
    if (!drag) { if (Math.abs(ddx) > 10 && Math.abs(ddx) > Math.abs(ddy)) drag = true; else return; }
    dx = Math.max(onDel ? -W : 0, Math.min(onPin ? W : 0, ddx + pos));
    mv(dx, false);
  }, { passive: true });
  row.addEventListener("touchend", () => {
    if (!drag) return;
    pos = (dx < -W / 2) ? -W : (dx > W / 2 ? W : 0);
    mv(pos, true);
    setTimeout(() => { drag = false; }, 80);
  });
  if (dl) dl.onclick = e => { e.stopPropagation(); onDel(close); };
  if (pl) pl.onclick = e => { e.stopPropagation(); onPin(close); };
  row.onclick = () => {
    if (drag) return;
    if (pos !== 0) { close(); return; }
    onTap();
  };
}

function addReactionChips(box){
  Array.from(box.children).forEach(div => {
    const it = div._it;
    if (!it || !it.reactions) return;
    const list = Object.keys(it.reactions).map(u => it.reactions[u]).filter(Boolean);
    if (!list.length) return;
    const counts = {};
    list.forEach(e => { counts[e] = (counts[e] || 0) + 1; });
    const chip = document.createElement("span");
    chip.style.cssText = "display:inline-block;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1px 7px;font-size:13px;margin-top:4px;box-shadow:0 1px 1px rgba(0,0,0,.1)";

    div.insertBefore(chip, div.querySelector(".t"));
  });
}
