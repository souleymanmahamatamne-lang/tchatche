<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tchatche</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
  header{background:#1a2d66;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:20px}
  header small{display:block;opacity:.8;font-size:12px}
  button{border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
  .primary{background:#e6b840;color:#1a2d66;font-weight:bold}
  .link{background:none;color:#fff;font-weight:bold}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #c8cfdd;border-radius:10px}
  .box{padding:16px}
  .row{display:flex;gap:8px}
  .err{color:#a02020;padding:8px 16px}
  .item{background:#fff;padding:14px 16px;border-bottom:1px solid #e5e7ee;cursor:pointer}
  #msgs{padding:12px;display:flex;flex-direction:column;gap:8px;height:calc(100vh - 150px);overflow-y:auto}
  .m{max-width:78%;padding:8px 12px;border-radius:14px;background:#fff;align-self:flex-start;word-wrap:break-word}
  .m.me{background:#d7e3ff;align-self:flex-end}
  .t{display:block;font-size:11px;color:#666;margin-top:4px;text-align:right}
  .hidden{display:none!important}
  #callBox{position:fixed;top:0;left:0;right:0;bottom:0;background:#1a2d66;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10;text-align:center;padding:24px}
  #callName{font-size:24px;font-weight:bold;word-break:break-all}
  #callStatus{font-size:16px;opacity:.85}
  .ok{background:#2e9e5b;color:#fff;font-weight:bold}
  .no{background:#c0392b;color:#fff;font-weight:bold}
</style>
</head>
<body>

<div id="login" class="box">
  <h2>Tchatche</h2>
  <p>Écris à tes proches, simplement</p>
  <input id="email" type="email" placeholder="E-mail"><br><br>
  <input id="pass" type="password" placeholder="Mot de passe"><br><br>
  <div class="row">
    <button class="primary" id="btnLogin">Se connecter</button>
    <button id="btnSignup">Créer un compte</button>
  </div>
  <div id="loginErr" class="err"></div>
</div>

<div id="home" class="hidden">
  <header>
    <div><h1>Mes messages</h1><small id="me"></small></div>
    <button class="link" id="btnOut">Quitter</button>
  </header>
  <div class="box row">
    <input id="proche" type="email" placeholder="E-mail de ton proche">
    <button class="primary" id="btnWrite">Écrire</button>
  </div>
  <div id="homeErr" class="err"></div>
  <div id="chatList"></div>
</div>

<div id="chat" class="hidden">
  <header>
    <button class="link" id="btnBack">← Retour</button>
    <div id="chatTitle"></div>
    <button class="link" id="btnCall">📞 Appeler</button>
  </header>
  <div id="msgs"></div>
  <div class="box row">
    <input id="txt" type="text" placeholder="Ton message">
    <button class="primary" id="btnSend">Envoyer</button>
  </div>
</div>

<div id="callBox" class="hidden">
  <div id="callName"></div>
  <div id="callStatus"></div>
  <div class="row">
    <button id="btnAccept" class="ok hidden">Répondre</button>
    <button id="btnHang" class="no">Raccrocher</button>
  </div>
</div>
<audio id="remote" autoplay playsinline></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6jhZLez7R8vkO8kr8ZDK56_cA8bZiSXk",
  authDomain: "tchatche-480f2.firebaseapp.com",
  projectId: "tchatche-480f2",
  storageBucket: "tchatche-480f2.firebasestorage.app",
  messagingSenderId: "307957255636",
  appId: "1:307957255636:web:cade6a0b56691aa9085a41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let user = null, unsubMsgs = null, unsubChats = null;

function show(name){
  ["login","home","chat"].forEach(n => $(n).classList.toggle("hidden", n !== name));
}

function formatDate(ts){
  const d = ts && ts.toDate ? ts.toDate() : new Date();
  return d.toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
}

$("btnLogin").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch(e){ $("loginErr").textContent = "Connexion impossible : " + e.code; }
};

$("btnSignup").onclick = async () => {
  $("loginErr").textContent = "";
  try { await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch(e){ $("loginErr").textContent = "Création impossible : " + e.code; }
};

$("btnOut").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (unsubChats) { unsubChats(); unsubChats = null; }
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  endCall(false);
  user = u;
  if (!u) { show("login"); return; }
  $("me").textContent = u.email;
  try { await setDoc(doc(db, "users", u.uid), { email: u.email.toLowerCase(), uid: u.uid }, { merge: true }); } catch(e){}
  show("home");
  loadChats();
});

function loadChats(){
  const q = query(collection(db, "chats"), where("participants", "array-contains", user.uid));
  unsubChats = onSnapshot(q, snap => {
    $("homeErr").textContent = "";
    const list = $("chatList");
    list.innerHTML = "";
    snap.forEach(d => {
      const data = d.data();
      const myMail = user.email.toLowerCase();
      let other = (data.emails || []).find(e => e !== myMail);
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = other || "Discussion";
      div.onclick = () => openChat(d.id, div.textContent);
      list.appendChild(div);
      if (!other) {
        const otherUid = (data.participants || []).find(p => p !== user.uid);
        if (otherUid) {
          getDoc(doc(db, "users", otherUid)).then(s => {
            if (s.exists() && s.data().email) div.textContent = s.data().email;
          }).catch(() => {});
        }
      }
      checkIncoming(d.id, data.call, other);
    });
  }, () => { $("homeErr").textContent = "Impossible de charger les discussions."; });
}

$("btnWrite").onclick = async () => {
  $("homeErr").textContent = "";
  const mail = $("proche").value.trim().toLowerCase();
  if (!mail) return;
  try {
    const r = await getDocs(query(collection(db, "users"), where("email", "==", mail)));
    if (r.empty) { $("homeErr").textContent = "Cette personne n'a pas encore de compte Tchatche."; return; }
    const other = r.docs[0].data();
    const id = [user.uid, other.uid].sort().join("_");
    await setDoc(doc(db, "chats", id), {
      participants: [user.uid, other.uid],
      emails: [user.email.toLowerCase(), mail]
    }, { merge: true });
    $("proche").value = "";
    openChat(id, mail);
  } catch(e){ $("homeErr").textContent = "Erreur : " + e.code; }
};

function openChat(id, title){
  show("chat");
  $("chatTitle").textContent = title;
  $("btnSend").dataset.id = id;
  if (unsubMsgs) unsubMsgs();
  const q = query(collection(db, "chats", id, "messages"), orderBy("createdAt"));
  unsubMsgs = onSnapshot(q, snap => {
    const box = $("msgs");
    box.innerHTML = "";
    snap.forEach(d => {
      const m = d.data();
      const div = document.createElement("div");
      div.className = "m" + (m.senderId === user.uid ? " me" : "");
      const span = document.createElement("span");
      span.textContent = m.text;
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = formatDate(m.createdAt);
      div.appendChild(span);
      div.appendChild(t);
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

$("btnBack").onclick = () => {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  show("home");
};

async function send(){
  const id = $("btnSend").dataset.id;
  const text = $("txt").value.trim();
  if (!text || !id) return;
  $("txt").value = "";
  try {
    await addDoc(collection(db, "chats", id, "messages"), {
      text, senderId: user.uid, createdAt: serverTimestamp()
    });
  } catch(e){ alert("Message non envoyé : " + e.code); }
}
$("btnSend").onclick = send;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* ---------- APPELS VOCAUX ---------- */
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
let pc = null, localStream = null, callChatId = null, callAt = 0;
let unsubCall = null, ringTimer = null, incoming = null, gotAnswer = false;

function callUI(name, status, showAccept){
  $("callBox").classList.remove("hidden");
  $("callName").textContent = name || "";
  $("callStatus").textContent = status;
  $("btnAccept").classList.toggle("hidden", !showAccept);
}

async function getMic(){
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ localStream = null; }
}

function makePc(){
  pc = new RTCPeerConnection(ICE);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  else pc.addTransceiver("audio", { direction: "recvonly" });
  pc.ontrack = e => { $("remote").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === "connected") $("callStatus").textContent = "En communication";
    if (pc.connectionState === "failed") {
      $("callStatus").textContent = "Connexion impossible";
      setTimeout(() => endCall(true), 2000);
    }
  };
}

function waitIce(){
  return new Promise(res => {
    if (pc.iceGatheringState === "complete") return res();
    const t = setTimeout(res, 5000);
    pc.onicegatheringstatechange = () => {
      if (pc && pc.iceGatheringState === "complete") { clearTimeout(t); res(); }
    };
  });
}

function endCall(notify){
  clearTimeout(ringTimer);
  if (unsubCall) { unsubCall(); unsubCall = null; }
  const id = callChatId;
  if (pc) { try { pc.close(); } catch(e){} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("remote").srcObject = null;
  $("callBox").classList.add("hidden");
  incoming = null; callChatId = null; gotAnswer = false;
  if (notify && id) updateDoc(doc(db, "chats", id), { "call.state": "ended" }).catch(() => {});
}

async function startCall(){
  const id = $("btnSend").dataset.id;
  if (!id || pc) return;
  const other = id.split("_").find(x => x !== user.uid);
  callChatId = id;
  gotAnswer = false;
  callUI($("chatTitle").textContent, "Appel en cours…", false);
  try {
    await getMic();
    makePc();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce();
    const at = Date.now();
    callAt = at;
    await updateDoc(doc(db, "chats", id), {
      call: {
        from: user.uid, to: other, state: "ringing", at,
        offer: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
      }
    });
    unsubCall = onSnapshot(doc(db, "chats", id), async s => {
      const c = s.data() && s.data().call;
      if (!pc || !c || c.at !== at) return;
      if (c.state === "answered" && c.answer && !gotAnswer && pc.signalingState === "have-local-offer") {
        gotAnswer = true;
        clearTimeout(ringTimer);
        $("callStatus").textContent = "Connexion…";
        try { await pc.setRemoteDescription(c.answer); } catch(e){ endCall(true); }
      }
      if (c.state === "declined") {
        $("callStatus").textContent = "Appel refusé";
        setTimeout(() => endCall(false), 1500);
      }
      if (c.state === "ended") endCall(false);
    });
    ringTimer = setTimeout(() => endCall(true), 45000);
  } catch(e){
    alert("Appel impossible : " + (e.code || e.message));
    endCall(true);
  }
}

function checkIncoming(chatId, c, otherMail){
  if (!c) return;
  if (c.to === user.uid && c.state === "ringing" && !pc && Date.now() - c.at < 90000) {
    if (!incoming || incoming.c.at !== c.at) {
      incoming = { id: chatId, c, name: otherMail || "Quelqu'un" };
      callUI(incoming.name, "t'appelle…", true);
    }
  } else if (incoming && incoming.id === chatId && incoming.c.at === c.at && c.state !== "ringing" && !pc) {
    incoming = null;
    $("callBox").classList.add("hidden");
  }
}

async function acceptCall(){
  if (!incoming || pc) return;
  const { id, c, name } = incoming;
  incoming = null;
  callChatId = id;
  callAt = c.at;
  callUI(name, "Connexion…", false);
  try {
    await getMic();
    makePc();
    await pc.setRemoteDescription(c.offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitIce();
    await updateDoc(doc(db, "chats", id), {
      "call.state": "answered",
      "call.answer": { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
    });
    unsubCall = onSnapshot(doc(db, "chats", id), s => {
      const x = s.data() && s.data().call;
      if (!x || x.at !== callAt || x.state === "ended") endCall(false);
    });
  } catch(e){
    alert("Réponse impossible : " + (e.code || e.message));
    endCall(true);
  }
}

function hangUp(){
  if (pc) { endCall(true); return; }
  if (incoming) {
    const id = incoming.id;
    incoming = null;
    $("callBox").classList.add("hidden");
    updateDoc(doc(db, "chats", id), { "call.state": "declined" }).catch(() => {});
  }
}

$("btnCall").onclick = startCall;
$("btnAccept").onclick = acceptCall;
$("btnHang").onclick = hangUp;
</script>
</body>
</html>
