<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tchatche</title>
<style>
:root{--bleu:#12306b;--soleil:#f2b705;--fond:#f4f6fb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;background:var(--fond)}
.vue{display:none;max-width:480px;height:100%;margin:auto;flex-direction:column;background:#fff}
.vue.actif{display:flex}
header{background:var(--bleu);color:#fff;padding:14px;display:flex;align-items:center;gap:10px}
header b{font-size:1.25rem;flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.principal{background:var(--soleil);color:var(--bleu)}
.lien{background:none;color:var(--bleu);text-decoration:underline}
.sombre{background:rgba(255,255,255,.2);color:#fff;padding:8px 12px}
.corps{padding:20px;display:flex;flex-direction:column;gap:12px}
h2{color:var(--bleu);margin:0}
input{font:inherit;padding:14px;border:2px solid #cfd6e4;border-radius:12px;width:100%}
.erreur{color:#c0261d;min-height:1.2em}
#liste{overflow:auto;flex:1}
.contact{padding:16px;border-bottom:1px solid #e5e9f2;cursor:pointer}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--fond)}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;background:#fff;align-self:flex-start;word-wrap:break-word}
.msg.moi{background:var(--soleil);align-self:flex-end}
.heure{display:block;font-size:.7rem;opacity:.6;text-align:right;margin-top:4px}
.saisie{display:flex;gap:8px;padding:10px;border-top:1px solid #e5e9f2}
</style>
</head>
<body>

<section class="vue actif" id="v-connexion">
  <header><b>Tchatche</b></header>
  <div class="corps">
    <small>Écris à tes proches, simplement</small>
    <h2 id="titre-connexion">Connexion</h2>
    <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="email">
    <input id="mdp" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
    <div class="erreur" id="erreur-connexion"></div>
    <button class="principal" id="btn-connexion">Se connecter</button>
    <button class="lien" id="btn-bascule">Pas de compte ? Créer un compte</button>
  </div>
</section>

<section class="vue" id="v-contacts">
  <header><b>Contacts</b><button class="sombre" id="btn-deco">Quitter</button></header>
  <div id="liste"></div>
</section>

<section class="vue" id="v-chat">
  <header><button class="sombre" id="btn-retour">←</button><b id="nom-chat"></b></header>
  <div id="messages"></div>
  <div class="saisie">
    <input id="texte" placeholder="Écris ton message" autocomplete="off">
    <button class="principal" id="btn-envoyer">Envoyer</button>
  </div>
</section>

// Formate l'heure d'un message (ex : 19:42). Ajoute la date si ce n'est pas aujourd'hui.
function formaterHeure(ts){
  if (!ts || !ts.toDate) return "";
  const d = ts.toDate();
  const heure = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  const aujourdhui = new Date();
  if (d.toDateString() === aujourdhui.toDateString()) return heure;
  const jour = d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
  return jour + " " + heure;
}
