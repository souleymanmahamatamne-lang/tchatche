<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tchatche</title>
<style>
  :root{--bleu:#12306b;--soleil:#f2b705;--fond:#eef2f7;--texte:#142033;--rouge:#c8102e}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--fond);color:var(--texte)}
  .vue{display:none;max-width:480px;height:100%;margin:0 auto;background:#fff;flex-direction:column}
  .vue.actif{display:flex}
  header{background:var(--bleu);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--soleil)}
  header b{font-size:1.25rem;letter-spacing:.02em}
  header small{display:block;opacity:.75;font-size:.8rem;margin-top:2px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--soleil);outline-offset:2px}
  .principal{background:var(--soleil);color:var(--texte)}
  .discret{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 12px}
  #accueil{justify-content:center;padding:28px}
  #accueil h1{font-size:2.4rem;margin:0 0 4px;color:var(--bleu)}
  #accueil p{margin:0 0 24px;color:#4a5a73}
  input{font:inherit;width:100%;padding:13px;margin-bottom:12px;border:1px solid #b8c4d6;border-radius:10px}
  .ligne{display:flex;gap:10px}.ligne button{flex:1}
  #connexion{background:var(--bleu);color:#fff}
  #erreur{color:var(--rouge);min-height:1.4em;margin:12px 0 0}
  #messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--fond)}
  .msg{max-width:80%;padding:9px 12px;border-radius:14px;background:#fff;align-self:flex-start;word-wrap:break-word}
  .msg small{display:block;font-size:.72rem;color:#5b6b85;margin-bottom:2px}
  .msg.moi{align-self:flex-end;background:var(--bleu);color:#fff}
  .msg.moi small{color:#c5d1ea}
  #envoi{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #d5dce8}
  #envoi input{margin:0}#envoi button{white-space:nowrap}
</style>
</head>
<body>

<section id="accueil" class="vue">
  <h1>Tchatche</h1>
  <p>Écris à tes proches, simplement.</p>
  <input id="email" type="email" placeholder="Ton e-mail" autocomplete="email">
  <input id="mdp" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
  <div class="ligne">
    <button id="connexion">Se connecter</button>
    <button id="inscription" class="principal">Créer un compte</button>
  </div>
  <p id="erreur" role="alert"></p>
</section>

<section id="chat" class="vue">
  <header>
    <div><b>Tchatche</b><small id="moi"></small></div>
    <button id="quitter" class="discret">Quitter</button>
  </header>
  <div id="messages"></div>
  <div id="envoi">
    <input id="texte" type="text" placeholder="Écris un message" autocomplete="off">
    <button id="envoyer" class="principal">Envoyer</button>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA6jhZLez7R8vkO8kr8ZDK56_cA8bZiSXk",
  authDomain: "tchatche-480f2.firebaseapp.com",
  projectId: "tchatche-480f2",
  storageBucket: "tchatche-480f2.firebasestorage.app",
  messagingSenderId: "307957255636",
  appId: "1:307957255636:web:cade6a0b56691aa9085a41"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let arreter = null;

const erreurs = {
  "auth/email-already-in-use": "Cet e-mail a déjà un compte. Touche « Se connecter ».",
  "auth/invalid-email": "Cet e-mail n'est pas valide. Vérifie-le.",
  "auth/weak-password": "Mot de passe trop court : 6 caractères minimum.",
  "auth/missing-password": "Écris ton mot de passe.",
  "auth/invalid-credential": "E-mail ou mot de passe incorrect."
};
const voir = id => { document.querySelectorAll(".vue").forEach(v => v.classList.remove("actif")); $(id).classList.add("actif"); };

async function entrer(action) {
  $("erreur").textContent = "";
  try { await action(auth, $("email").value.trim(), $("mdp").value); }
  catch (e) { $("erreur").textContent = erreurs[e.code] || "Échec (" + e.code + "). Réessaie."; }
}
$("inscription").onclick = () => entrer(createUserWithEmailAndPassword);
$("connexion").onclick = () => entrer(signInWithEmailAndPassword);
$("quitter").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (arreter) { arreter(); arreter = null; }
  if (!user) return voir("accueil");
  $("moi").textContent = user.email;
  voir("chat");
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(50));
  arreter = onSnapshot(q, snap => {
    const boite = $("messages");
    boite.innerHTML = "";
    snap.docs.map(d => d.data()).reverse().forEach(m => {
      const bulle = document.createElement("div");
      bulle.className = "msg" + (m.uid === user.uid ? " moi" : "");
      const qui = document.createElement("small");
      qui.textContent = m.email;
      const texte = document.createElement("div");
      texte.textContent = m.text;
      bulle.append(qui, texte);
      boite.append(bulle);
    });
    boite.scrollTop = boite.scrollHeight;
  }, () => { $("messages").textContent = "Impossible de charger les messages."; });
});

async function envoyer() {
  const t = $("texte").value.trim();
  if (!t) return;
  $("texte").value = "";
  try {
    await addDoc(collection(db, "messages"), { text: t, uid: auth.currentUser.uid, email: auth.currentUser.email, createdAt: serverTimestamp() });
  } catch (e) { $("texte").value = t; }
}
$("envoyer").onclick = envoyer;
$("texte").onkeydown = e => { if (e.key === "Enter") envoyer(); };
</script>
</body>
</html>
