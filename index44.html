  row.style.position = "relative";

  const mkBtn = (parent, bg, icon, label) => {
    const b = document.createElement("button");
    b.style.cssText = "flex:1;border-radius:0;background:" + bg + ";color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px";
    const i = document.createElement("span");
    i.textContent = icon;
    i.style.fontSize = "22px";
    b.appendChild(i);
    if (label) {
      const t = document.createElement("span");
      t.textContent = label;
      t.style.fontSize = "11px";
      b.appendChild(t);
    }
    parent.appendChild(b);
    return b;
  };
  const mkBox = (side, w) => {
    const bx = document.createElement("div");
    bx.style.cssText = "position:absolute;top:0;bottom:0;" + side + ":0;width:" + w + "px;display:flex;transform:translateX(" + (side === "right" ? "100%" : "-100%") + ")";
    row.appendChild(bx);
    return bx;
  };
  if (pinned) {
    const m = document.createElement("span");
    m.textContent = "📌";
    m.style.cssText = "position:absolute;left:46px;bottom:6px;font-size:13px";
    row.appendChild(m);
  }
  const rbox = R ? mkBox("right", R) : null;
  const ab = onArch ? mkBtn(rbox, "#667781", "📦", archLabel || "Archiver") : null;
  const dl = onDel ? mkBtn(rbox, "#e5545c", "🗑", "Supprimer") : null;
  const lbox = onPin ? mkBox("left", W) : null;
  const pl = onPin ? mkBtn(lbox, "#128C7E", "📌", pinned ? "Désépingler" : "Épingler") : null;
  const mv = (px, anim) => {
    const tr = anim ? "transform .15s" : "none";
    Array.from(row.children).forEach(c => {
      c.style.transition = tr;
      if (c === rbox) c.style.transform = "translateX(" + (R + px) + "px)";
      else if (c === lbox) c.style.transform = "translateX(" + (px - W) + "px)";
      else c.style.transform = "translateX(" + px + "px)";
    });
  };
  const close = () => { pos = 0; mv(0, true); };
  row.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; drag = false; }, { passive: true });
  row.addEventListener("touchmove", e => {
    const t = e.touches[0], ddx = t.clientX - x0, ddy = t.clientY - y0;
    if (!drag) { if (Math.abs(ddx) > 10 && Math.abs(ddx) > Math.abs(ddy)) drag = true; else return; }
    dx = Math.max(-R, Math.min(onPin ? W : 0, ddx + pos));
    mv(dx, false);
  }, { passive: true });
  row.addEventListener("touchend", () => {
    if (!drag) return;
    pos = (dx < -R / 2) ? -R : (dx > W / 2 ? W : 0);
    mv(pos, true);
    setTimeout(() => { drag = false; }, 80);
  });
  if (ab) ab.onclick = e => { e.stopPropagation(); onArch(close); };
  if (dl) dl.onclick = e => { e.stopPropagation(); onDel(close); };
  if (pl) pl.onclick = e => { e.stopPropagation(); onPin(close); };
  row.onclick = () => {
    if (drag) return;
    if (pos !== 0) { close(); return; }
    onTap();
  };
}
